# Builds the Vite "division-dashboard" app and publishes a combined static
# site to GitHub Pages:
#   /                     -> existing plantation-monitoring dashboard (index.html)
#   /division-dashboard/  -> the React/Vite Division Dashboard
#
# One-time setup in the repo: Settings -> Pages -> "Build and deployment" ->
# Source: "GitHub Actions". Deploys run on every push to the default branch.
name: Deploy to GitHub Pages

on:
  push:
    branches: [GeM-Technical-Evaluation]
  workflow_dispatch:

# Permissions required by the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: division-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: division-dashboard
        run: npm ci

      - name: Build division dashboard
        working-directory: division-dashboard
        run: npm run build

      - name: Assemble Pages site
        run: |
          set -eux
          rm -rf _site
          mkdir -p _site/division-dashboard
          # Root: existing plantation-monitoring dashboard + data-entry templates
          cp index.html _site/index.html
          if [ -d templates ]; then cp -r templates _site/templates; fi
          # Subpath: built Division Dashboard (Vite base is "./", so it works here)
          cp -r division-dashboard/dist/. _site/division-dashboard/
          # Skip Jekyll processing of the static output
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
